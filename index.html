<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Journal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080808;
  --surface:#111;
  --surface2:#151515;
  --white:#f4f4f2;
  --text:#d5d5d1;
  --muted:#777774;
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.16);
  --gold:#b69a63;
  --gold2:#d2b878;
  --green:#77b99a;
  --shadow:0 25px 70px rgba(0,0,0,.55),0 5px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:"Inter","Mali",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -15%,rgba(182,154,99,.08),transparent 35%),
    linear-gradient(145deg,#060606,#0a0a0a 45%,#070707);
  background-attachment:fixed;
  min-height:100vh;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;
  background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:80px 80px;
  mask-image:linear-gradient(to bottom,black,transparent 75%);
}
.page{display:none}.page.active{display:block}

#home{
  width:min(100%,460px);margin:0 auto;
  padding:42px 18px 70px;
  padding-top:max(42px,env(safe-area-inset-top));
  padding-bottom:max(70px,env(safe-area-inset-bottom));
}
.title{
  position:relative;padding:38px 24px 32px;margin-bottom:28px;text-align:center;
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  overflow:hidden;animation:reveal .8s cubic-bezier(.2,.8,.2,1) both;
}
.title:before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  box-shadow:0 0 15px rgba(182,154,99,.5);
}
.title .mark{
  position:relative;z-index:1;margin-bottom:16px;color:var(--gold);
  font-size:.67rem;font-weight:600;letter-spacing:.35em;
}
.title h1{position:relative;z-index:1;font-weight:500;font-size:1.6rem;letter-spacing:.04em;color:var(--white)}
.title p{position:relative;z-index:1;margin-top:10px;font-family:"Mali",sans-serif;font-size:.72rem;color:var(--muted)}

ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:11px}
.row{
  position:relative;display:grid;grid-template-columns:52px 1fr 52px;gap:11px;align-items:center;
  padding:8px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 35px rgba(0,0,0,.32);
  overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;
  animation:reveal .65s cubic-bezier(.2,.8,.2,1) both;
}
.row:nth-child(1){animation-delay:.04s}.row:nth-child(2){animation-delay:.08s}
.row:nth-child(3){animation-delay:.12s}.row:nth-child(4){animation-delay:.16s}
.row:nth-child(5){animation-delay:.20s}.row:nth-child(6){animation-delay:.24s}
.row:nth-child(7){animation-delay:.28s}
.row:before{
  content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.035),transparent);
  transform:skewX(-20deg);transition:left .7s;pointer-events:none;
}
.row:hover:before{left:140%}
.row:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 35px 90px rgba(0,0,0,.7),0 8px 25px rgba(0,0,0,.45)}

.name{
  width:100%;min-width:0;height:50px;border:1px solid transparent;border-radius:11px;
  background:transparent;text-align:center;font-family:"Mali",sans-serif;font-weight:500;
  font-size:.95rem;color:var(--white);transition:.25s;
}
.name:hover{background:rgba(255,255,255,.025)}
.name:focus{outline:none;background:rgba(255,255,255,.035);border-color:rgba(182,154,99,.35);box-shadow:0 0 0 3px rgba(182,154,99,.06)}
.name::placeholder{color:#4f4f4c;font-weight:400}

.cell{
  appearance:none;border:0;cursor:pointer;width:50px;height:50px;display:grid;place-items:center;
  position:relative;overflow:hidden;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s;
}
.cell svg{position:relative;z-index:2;width:20px;height:20px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cell:active{transform:scale(.91)}

.cell.img{
  background:linear-gradient(145deg,#181818,#101010);
  border:1px solid rgba(255,255,255,.07);border-radius:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 5px 15px rgba(0,0,0,.35);
}
.cell.img svg{stroke:#8d8d88}
.cell.img:hover{border-color:rgba(182,154,99,.25);box-shadow:0 0 20px rgba(182,154,99,.06)}
.cell.img:hover svg{stroke:var(--gold2);transform:scale(1.08)}

.cell.ok{
  background:linear-gradient(145deg,#171a19,#0f1110);
  border:1px solid rgba(119,185,154,.12);border-radius:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 5px 15px rgba(0,0,0,.35);
}
.cell.ok svg{stroke:#6c8e7e;stroke-width:1.9}
.cell.ok:hover{border-color:rgba(119,185,154,.35);box-shadow:0 0 22px rgba(119,185,154,.07)}
.cell.ok:hover svg{stroke:#8bc7a9;transform:scale(1.08)}

.trade-thumb{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(.9) contrast(1.02);
  transition:transform .35s ease,filter .35s ease;
}
.cell.img:hover .trade-thumb{transform:scale(1.08);filter:saturate(1.05) contrast(1.05)}
.image-badge{
  position:absolute;right:4px;bottom:4px;z-index:3;
  width:15px;height:15px;border-radius:50%;
  background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.25);
}
.image-badge:after{
  content:"";position:absolute;inset:4px;border:1px solid var(--gold);border-radius:50%;
}

/* Blank page */
.blank{
  min-height:100vh;position:relative;
  background:radial-gradient(circle at 50% 45%,rgba(182,154,99,.035),transparent 30%),linear-gradient(145deg,#070707,#0b0b0b);
  animation:pageFade .4s ease both;
}
.blank:before{
  content:"";position:absolute;top:50%;left:50%;width:150px;height:150px;
  transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(182,154,99,.12);
  box-shadow:0 0 0 28px rgba(182,154,99,.018),0 0 0 56px rgba(182,154,99,.012);
  animation:pulse 4s ease-in-out infinite;
}
.blank:after{
  content:"";position:absolute;top:50%;left:50%;width:5px;height:5px;transform:translate(-50%,-50%);
  background:var(--gold);border-radius:50%;box-shadow:0 0 20px rgba(182,154,99,.7);
}
.back{
  position:fixed;top:max(18px,env(safe-area-inset-top));left:18px;width:46px;height:46px;
  border:1px solid rgba(255,255,255,.10);background:rgba(15,15,15,.85);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;
  color:#a9a9a5;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.45);transition:.2s;
}
.back:hover{color:var(--gold2);border-color:rgba(182,154,99,.3);transform:translateX(-2px)}
.back:active{transform:scale(.91)}
.back svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Fullscreen image viewer */
.viewer{
  position:fixed;inset:0;z-index:1000;
  display:none;align-items:center;justify-content:center;
  padding:28px;
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.viewer.open{display:flex;animation:viewerIn .25s ease both}
.viewer img{
  max-width:96vw;max-height:92vh;width:auto;height:auto;
  object-fit:contain;display:block;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 100px rgba(0,0,0,.8);
  animation:imageIn .3s cubic-bezier(.2,.8,.2,1) both;
}
.viewer-close{
  position:fixed;top:max(18px,env(safe-area-inset-top));right:18px;
  width:46px;height:46px;border-radius:12px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(15,15,15,.9);color:#bbb;
  cursor:pointer;font-size:24px;line-height:1;
  display:grid;place-items:center;transition:.2s;
}
.viewer-close:hover{color:var(--gold2);border-color:rgba(182,154,99,.35);transform:rotate(90deg)}
.viewer-hint{
  position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);font-size:.68rem;color:#666;letter-spacing:.04em;
  white-space:nowrap;
}

@keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pageFade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.65}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1}}
@keyframes viewerIn{from{opacity:0}to{opacity:1}}
@keyframes imageIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}


/* Right-side trade journal: 1-100 rows x 8 data columns */
.journal-page{
  min-height:100vh;
  padding:78px 18px 60px;
  background:
    radial-gradient(circle at 50% 0%,rgba(182,154,99,.045),transparent 30%),
    linear-gradient(145deg,#070707,#0b0b0b);
  animation:pageFade .4s ease both;
}
.journal-wrap{
  width:min(1180px,100%);
  margin:0 auto;
}
.journal-title{
  text-align:center;
  margin:0 auto 22px;
  padding:8px 8px 18px;
}
.journal-kicker{
  color:var(--gold);
  font-size:.65rem;
  font-weight:600;
  letter-spacing:.3em;
}
.journal-title h2{
  margin-top:8px;
  color:var(--white);
  font-size:1.45rem;
  font-weight:500;
}
.journal-title p{
  margin-top:7px;
  color:var(--muted);
  font-family:"Mali",sans-serif;
  font-size:.72rem;
}
.journal-table-shell{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(12,12,12,.82);
  box-shadow:var(--shadow);
  scrollbar-color:rgba(182,154,99,.35) #0b0b0b;
}
.journal-table{
  width:100%;
  min-width:980px;
  border-collapse:separate;
  border-spacing:0;
  table-layout:fixed;
}
.journal-table th,
.journal-table td{
  height:46px;
  padding:5px 7px;
  border-right:1px solid rgba(255,255,255,.065);
  border-bottom:1px solid rgba(255,255,255,.065);
}
.journal-table th{
  position:sticky;
  top:0;
  z-index:3;
  background:linear-gradient(145deg,#181510,#11100d);
  color:var(--gold2);
  font-size:.72rem;
  font-weight:600;
  letter-spacing:.04em;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,.35);
}
.journal-table th:first-child{
  width:54px;
}
.journal-table th:nth-child(2){width:135px}
.journal-table th:nth-child(3){width:90px}
.journal-table th:nth-child(4){width:120px}
.journal-table th:nth-child(5){width:105px}
.journal-table th:nth-child(6){width:120px}
.journal-table th:nth-child(7),
.journal-table th:nth-child(8),
.journal-table th:nth-child(9){width:110px}
.journal-table td{
  background:rgba(255,255,255,.012);
}
.journal-table tr:hover td{
  background:rgba(182,154,99,.025);
}
.journal-table th:last-child,
.journal-table td:last-child{border-right:0}
.journal-table tbody tr:last-child td{border-bottom:0}
.row-number{
  position:sticky;
  left:0;
  z-index:2;
  width:54px;
  min-width:54px;
  text-align:center;
  color:#888782;
  background:#0d0d0d !important;
  font-size:.72rem;
  font-weight:500;
}
.journal-table input{
  width:100%;
  height:34px;
  padding:0 8px;
  border:1px solid transparent;
  border-radius:8px;
  outline:none;
  background:rgba(255,255,255,.025);
  color:var(--text);
  font-family:"Inter","Mali",system-ui,sans-serif;
  font-size:.72rem;
  text-align:center;
  transition:.2s;
}
.journal-table input:hover{
  background:rgba(255,255,255,.045);
}
.journal-table input:focus{
  background:rgba(182,154,99,.045);
  border-color:rgba(182,154,99,.35);
  box-shadow:0 0 0 3px rgba(182,154,99,.05);
}
.journal-table input::placeholder{color:#4f4f4c}

/* Image column (column 9) */
.journal-table th:nth-child(10){width:190px}
.image-cell{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:34px;
}
.image-slot{
  position:relative;
  width:70px;
  height:34px;
  border:1px dashed rgba(182,154,99,.28);
  border-radius:8px;
  background:rgba(255,255,255,.02);
  color:#777;
  cursor:pointer;
  overflow:hidden;
  display:grid;
  place-items:center;
  transition:.2s;
  flex:0 0 70px;
}
.image-slot:hover{
  border-color:rgba(182,154,99,.55);
  background:rgba(182,154,99,.05);
  color:var(--gold2);
}
.image-slot img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.image-slot .slot-add{
  font-size:.62rem;
  line-height:1;
  text-align:center;
}
.image-slot .slot-remove{
  position:absolute;
  top:2px;
  right:2px;
  width:15px;
  height:15px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.78);
  color:#ddd;
  font-size:11px;
  line-height:15px;
  padding:0;
  cursor:pointer;
  z-index:2;
}
.image-slot .slot-remove:hover{color:var(--gold2)}
.image-count{
  position:absolute;
  right:3px;
  bottom:3px;
  padding:1px 4px;
  border-radius:4px;
  background:rgba(0,0,0,.72);
  color:#ddd;
  font-size:.5rem;
}
@media(max-width:700px){
  .journal-page{padding:72px 10px 45px}
  .journal-title{margin-bottom:14px}
  .journal-title h2{font-size:1.2rem}
  .journal-table-shell{border-radius:14px}
}

@media(max-width:380px){
  #home{padding-left:12px;padding-right:12px}
  .row{grid-template-columns:48px 1fr 48px;gap:7px}
  .cell{width:46px;height:46px}
  .name{height:46px;font-size:.9rem}
  .title{padding:32px 18px 28px}
  .viewer{padding:12px}
  .viewer img{max-width:100vw;max-height:88vh}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<main id="home" class="page active">
  <header class="title">
    <div class="mark">TRADING</div>
    <h1>บันทึกการเทรด</h1>
    <p>Trading Journal</p>
  </header>
  <ul id="list"></ul>
</main>

<section id="blank" class="page blank journal-page" aria-label="ตารางบันทึกการเทรด">
  <button class="back" id="backBtn" aria-label="ย้อนกลับ">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>

  <div class="journal-wrap">
    <div class="journal-title">
      <div class="journal-kicker">TRADING JOURNAL</div>
      <h2 id="journalHeading">ท่าที่ 1</h2>
      <p>บันทึกการเทรด 1–100</p>
    </div>

    <div class="journal-table-shell">
      <table class="journal-table">
        <thead>
          <tr>
            <th class="number-head">#</th>
            <th>Date</th>
            <th>TF</th>
            <th>Order</th>
            <th>เวลา</th>
            <th>Result</th>
            <th>TP1</th>
            <th>TP2</th>
            <th>TP3</th>
            <th>รูปภาพ</th>
          </tr>
        </thead>
        <tbody id="journalBody"></tbody>
      </table>
    </div>
  </div>
</section>

<!-- Fullscreen image viewer -->
<div class="viewer" id="viewer" aria-hidden="true">
  <button class="viewer-close" id="viewerClose" aria-label="ปิด">×</button>
  <img id="viewerImage" alt="กราฟการเทรด ท่าที่ 1">
  <div class="viewer-hint">แตะพื้นที่ด้านนอกหรือ × เพื่อปิด</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  measurementId: "G-7M8NV0BX6D"
};
let cloudReady = false;
let cloudDb = null;
let cloudStorage = null;
let namesWriteTimer = null;
let journalWriteTimers = {};
let lastCloudJournal = {};
let lastCloudNames = null;
let names = {};

try { names = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}

function cloudStatus(message, isError=false) {
  let el = document.getElementById('cloudSyncStatus');
  if (!el) {
    el = document.createElement('div');
    el.id = 'cloudSyncStatus';
    el.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:99999;padding:8px 12px;border:1px solid #c9a646;border-radius:10px;background:#111;color:#f4d778;font:12px/1.4 system-ui;box-shadow:0 4px 18px #0008;max-width:80vw';
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.style.borderColor = isError ? '#e05b5b' : '#c9a646';
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(names)); } catch(e) {}
  if (cloudReady) {
    clearTimeout(namesWriteTimer);
    namesWriteTimer = setTimeout(async () => {
      try {
        await cloudDb.collection('sharedJournal').doc('names').set({names, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
        lastCloudNames = JSON.stringify(names);
      } catch(e) { cloudStatus('ซิงก์ชื่อไม่สำเร็จ: ตรวจสอบ Firestore Rules', true); console.error(e); }
    }, 450);
  }
}


for(let i = 1; i <= 7; i++){

  const def = 'ท่าที่ ' + i;
  const li = document.createElement('li');
  li.className = 'row';

  const leftButton = i === 1
    ? `
      <button class="cell img has-image" data-image="1"
        aria-label="เปิดรูปกราฟของท่าที่ 1">
        <img class="trade-thumb" src="${tradeImage}" alt="กราฟท่าที่ 1">
        <span class="image-badge"></span>
      </button>
    `
    : `
      <button class="cell img" data-go="left-${i}"
        aria-label="เปิดหน้าซ้ายของ ${def}">
        ${imgIcon}
      </button>
    `;

  li.innerHTML = `
    ${leftButton}
    <input class="name" type="text" maxlength="30"
      placeholder="${def}"
      value="${(names[i] ?? def).replace(/"/g,'&quot;')}"
      aria-label="ชื่อ ${def}" enterkeyhint="done">
    <button class="cell ok" data-go="right-${i}"
      aria-label="เปิดหน้าขวาของ ${def}">
      ${tick}
    </button>
  `;

  const input = li.querySelector('.name');

  input.addEventListener('input', () => {
    names[i] = input.value;
    save();
  });

  input.addEventListener('blur', () => {
    if(!input.value.trim()){
      input.value = def;
      delete names[i];
      save();
    }
  });

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') input.blur();
  });

  list.appendChild(li);
}

/* Hash routing */
const home = document.getElementById('home');
const blank = document.getElementById('blank');

const journalBody = document.getElementById('journalBody');
const journalHeading = document.getElementById('journalHeading');
const JOURNAL_KEY = 'trade-journal-data';

function loadJournalData(){
  try { return JSON.parse(localStorage.getItem(JOURNAL_KEY)) || {}; }
  catch(e) { return {}; }
}

function saveJournalData(data){
  try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(data)); } catch(e) {}
  if (!cloudReady) return;
  // One Firestore document per technique avoids a single oversized document.
  for (let n = 1; n <= 7; n++) {
    const payload = JSON.stringify(data[n] || {});
    if (lastCloudJournal[n] === payload) continue;
    clearTimeout(journalWriteTimers[n]);
    journalWriteTimers[n] = setTimeout(async () => {
      try {
        await cloudDb.collection('sharedJournal').doc('technique-' + n).set({
          rows: data[n] || {},
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        lastCloudJournal[n] = payload;
        cloudStatus('ซิงก์ข้อมูลแล้ว ✓');
      } catch(e) { cloudStatus('ซิงก์ไม่สำเร็จ: ตรวจสอบ Firestore Rules', true); console.error(e); }
    }, 650);
  }
}

function applyRemoteNames(remoteNames) {
  names = remoteNames || {};
  try { localStorage.setItem(KEY, JSON.stringify(names)); } catch(e) {}
  document.querySelectorAll('#list .name').forEach((input, index) => {
    if (document.activeElement !== input) input.value = names[index + 1] ?? ('ท่าที่ ' + (index + 1));
  });
}

function applyRemoteJournal(technique, rows) {
  const all = loadJournalData();
  all[technique] = rows || {};
  try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(all)); } catch(e) {}
  lastCloudJournal[technique] = JSON.stringify(rows || {});
  if (location.hash === '#right-' + technique) {
    const focused = document.activeElement;
    if (focused && focused.matches && focused.matches('#journalBody input')) {
      const row = focused.dataset.row, field = focused.dataset.field;
      const latestValue = all[technique]?.[row]?.[field] || '';
      if (focused.value !== latestValue) focused.value = latestValue;
    } else {
      buildJournal(technique);
    }
  }
}

function startCloudSync() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    cloudDb = firebase.firestore();
    cloudStorage = firebase.storage();
    cloudReady = true;
    cloudStatus('กำลังเชื่อมต่อฐานข้อมูล…');
    const namesRef = cloudDb.collection('sharedJournal').doc('names');
    namesRef.onSnapshot(async snap => {
      if (snap.exists) {
        const remote = snap.data().names || {};
        const local = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } })();
        if (!Object.keys(remote).length && Object.keys(local).length && lastCloudNames === null) {
          await namesRef.set({names: local, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
          return;
        }
        lastCloudNames = JSON.stringify(remote);
        applyRemoteNames(remote);
      } else {
        // Seed only from this browser's existing local data; an empty visitor browser does not overwrite cloud data.
        const local = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } })();
        if (Object.keys(local).length) await namesRef.set({names: local, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
        else await namesRef.set({names: {}, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
      }
    }, e => { cloudStatus('อ่านข้อมูลไม่ได้: ตรวจสอบ Firestore Rules', true); console.error(e); });
    for (let n = 1; n <= 7; n++) {
      cloudDb.collection('sharedJournal').doc('technique-' + n).onSnapshot(async snap => {
        if (snap.exists) {
          const remoteRows = snap.data().rows || {};
          const localRows = loadJournalData()[n] || {};
          if (!Object.keys(remoteRows).length && Object.keys(localRows).length && lastCloudJournal[n] === undefined) {
            await cloudDb.collection('sharedJournal').doc('technique-' + n).set({rows: localRows, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
            return;
          }
          applyRemoteJournal(n, remoteRows);
        } else {
          const local = loadJournalData()[n] || {};
          if (Object.keys(local).length) {
            await cloudDb.collection('sharedJournal').doc('technique-' + n).set({rows: local, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
          } else {
            lastCloudJournal[n] = '{}';
          }
        }
      }, e => { cloudStatus('อ่านข้อมูลเทรดไม่ได้: ตรวจสอบ Firestore Rules', true); console.error(e); });
    }
    cloudStatus('เชื่อมต่อเรียลไทม์แล้ว');
  } catch(e) {
    cloudReady = false;
    cloudStatus('เชื่อม Firebase ไม่สำเร็จ ตรวจสอบ config', true);
    console.error(e);
  }
}


function buildJournal(tradeNo){
  journalHeading.textContent = 'ท่าที่ ' + tradeNo;
  journalBody.innerHTML = '';

  const data = loadJournalData();
  const tradeData = data[tradeNo] || {};
  const fields = ['date','tf','order','time','result','tp1','tp2','tp3'];
  const types = ['date','text','text','time','text','text','text','text'];
  const placeholders = ['','','','','','','',''];

  for(let i = 1; i <= 100; i++){
    const tr = document.createElement('tr');

    const number = document.createElement('td');
    number.className = 'row-number';
    number.textContent = i;
    tr.appendChild(number);

    fields.forEach((field, index) => {
      const td = document.createElement('td');
      const input = document.createElement('input');
      input.type = types[index];
      input.value = tradeData[i]?.[field] || '';
      input.placeholder = placeholders[index];
      input.dataset.row = i;
      input.dataset.field = field;
      input.setAttribute('aria-label', `ท่าที่ ${tradeNo} แถว ${i} ${field}`);

      input.addEventListener('input', () => {
        const latest = loadJournalData();
        latest[tradeNo] ||= {};
        latest[tradeNo][i] ||= {};
        latest[tradeNo][i][field] = input.value;
        saveJournalData(latest);
      });

      td.appendChild(input);
      tr.appendChild(td);
    });

    /* Column 9: up to 2 images per trade row */
    const imageTd = document.createElement('td');
    const imageCell = document.createElement('div');
    imageCell.className = 'image-cell';
    imageCell.setAttribute('aria-label', `รูปภาพท่าที่ ${tradeNo} แถว ${i}`);

    const storedImages = Array.isArray(tradeData[i]?.images)
      ? tradeData[i].images.slice(0,2)
      : [];

    function renderImageSlots(){
      imageCell.innerHTML = '';

      for(let slot = 0; slot < 2; slot++){
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'image-slot';

        const src = storedImages[slot];

        if(src){
          const img = document.createElement('img');
          img.src = src;
          img.alt = `รูปที่ ${slot + 1} ท่าที่ ${tradeNo} แถว ${i}`;
          button.appendChild(img);

          const remove = document.createElement('span');
          remove.className = 'slot-remove';
          remove.textContent = '×';
          remove.title = 'ลบรูป';
          remove.addEventListener('click', e => {
            e.stopPropagation();
            storedImages.splice(slot, 1);
            persistImages();
            renderImageSlots();
          });
          button.appendChild(remove);

          button.addEventListener('click', () => openImage(src));
        }else{
          const add = document.createElement('span');
          add.className = 'slot-add';
          add.textContent = '+ รูป';
          button.appendChild(add);

          button.addEventListener('click', () => {
            if(storedImages.length >= 2) return;
            fileInput.click();
          });
        }

        imageCell.appendChild(button);
      }
    }

    function persistImages(){
      const latest = loadJournalData();
      latest[tradeNo] ||= {};
      latest[tradeNo][i] ||= {};
      latest[tradeNo][i].images = storedImages;
      saveJournalData(latest);
    }

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.multiple = false;
    fileInput.style.display = 'none';

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      fileInput.value = '';
      if(!file || storedImages.length >= 2) return;

      try{
        const compressed = await compressImage(file);
        let sharedImageUrl = compressed;
        if (cloudReady) {
          const imagePath = 'journal-images/technique-' + tradeNo + '/row-' + i + '/' + Date.now() + '-' + Math.random().toString(36).slice(2) + '.jpg';
          const imageRef = cloudStorage.ref(imagePath);
          await imageRef.putString(compressed, 'data_url', { contentType: 'image/jpeg' });
          sharedImageUrl = await imageRef.getDownloadURL();
        }
        storedImages.push(sharedImageUrl);
        persistImages();
        renderImageSlots();
      }catch(err){
        alert('ไม่สามารถเพิ่มรูปภาพนี้ได้');
      }
    });

    imageTd.appendChild(imageCell);
    imageTd.appendChild(fileInput);
    tr.appendChild(imageTd);

    journalBody.appendChild(tr);
    renderImageSlots();
  }
}

function compressImage(file){
  return new Promise((resolve,reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const img = new Image();

      img.onload = () => {
        const maxSide = 1400;
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const result = canvas.toDataURL('image/jpeg', .78);
        resolve(result);
      };

      img.onerror = reject;
      img.src = reader.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function route(){
  const hash = location.hash.slice(1);
  const isJournal = /^right-[1-7]$/.test(hash);
  const isLeft = /^left-[1-7]$/.test(hash);
  const isBlank = isJournal || isLeft;

  home.classList.toggle('active', !isBlank);
  blank.classList.toggle('active', isBlank);

  if(isJournal){
    buildJournal(Number(hash.split('-')[1]));
  }

  window.scrollTo(0,0);
}

/* Fullscreen image */
const viewer = document.getElementById('viewer');
const viewerImage = document.getElementById('viewerImage');
const viewerClose = document.getElementById('viewerClose');

function openImage(src = tradeImage){
  viewerImage.src = src;
  viewer.classList.add('open');
  viewer.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}

function closeImage(){
  viewer.classList.remove('open');
  viewer.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

list.addEventListener('click', e => {

  const imageButton = e.target.closest('[data-image="1"]');

  if(imageButton){
    openImage();
    return;
  }

  const b = e.target.closest('[data-go]');

  if(b){
    location.hash = b.dataset.go;
  }
});

viewerClose.addEventListener('click', closeImage);

viewer.addEventListener('click', e => {
  if(e.target === viewer) closeImage();
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeImage();
});

/* Back */
document.getElementById('backBtn').addEventListener('click', () => {
  if(history.length > 1) history.back();
  else location.hash = '';
});

window.addEventListener('hashchange', route);
route();
startCloudSync();
</script>
